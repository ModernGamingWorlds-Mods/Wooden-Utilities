// ForgeGradle 6.x does not support Gradle 9+ (Groovy 4.x adds getDisablePropertyName()
// as abstract in AbstractExtensionMethodCache; FG6 doesn't implement it).
// Always use ./gradlew (wrapper pins Gradle 8.13). Running with a global Gradle 9.x
// installation will fail with "Missing implementation of ... getDisablePropertyName()".
if (gradle.gradleVersion.split('\\.')[0].toInteger() >= 9) {
    throw new GradleException(
        "\n\n  *** WRONG GRADLE VERSION ***\n" +
        "  ForgeGradle 6.x does not support Gradle 9+.\n" +
        "  You are running: Gradle ${gradle.gradleVersion}\n" +
        "  Required:        Gradle 8.13 (use ./gradlew, not gradle)\n" +
        "  On Windows:      .\\gradlew\n\n"
    )
}

pluginManagement {
    repositories {
        maven { url = 'https://maven.kikugie.dev/releases' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.blamejared.com' }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.5.2'
}

stonecutter {
    centralScript = 'build.gradle'
    create(rootProject) {
        versions '1.20.1-forge', '1.20.2-forge', '1.20.4-forge', '1.20.6-forge',
                 '1.21.1-neoforge', '1.21.4-neoforge', '1.21.5-neoforge',
                 '1.21.7-neoforge', '1.21.8-neoforge', '1.21.9-neoforge',
                 '1.21.10-neoforge', '1.21.11-neoforge', '26.1.0.1-neoforge'
    }
}

rootProject.name = 'Wooden-Utilities'

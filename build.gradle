plugins {
    id 'net.minecraftforge.gradle' version '6.0.24'
    id 'com.modrinth.minotaur' version '2.8.0'
}

group = project.maven_group
version = "${project.minecraft_version}-${project.mod_version}"
archivesBaseName = project.mod_id // The name of your mod

minecraft {
    version = "${project.minecraft_version}-${project.forge_version}"
    runDir = "run"
    mappings = "official"
    modLoaders = ['forge']
}

repositories {
    maven {
        name = "Forge Maven"
        url = uri("https://maven.minecraftforge.net")
    }
    mavenCentral()
}

dependencies {
    // The Forge dependency itself
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
}

tasks.named('processResources', ProcessResources) {
    inputs.properties([
        mod_id: project.mod_id,
        mod_name: project.mod_name,
        mod_description: project.mod_description,
        mod_license: project.mod_license,
        mod_version: project.mod_version,
        minecraft_version: project.minecraft_version,
        forge_version: project.forge_version,
        mod_author: project.mod_author,
        mod_homepage: project.mod_homepage,
        mod_issues: project.mod_issues,
        mod_source: project.mod_source,
    ])

    filesMatching('META-INF/mods.toml') {
        expand inputs.properties
    }
}

tasks.named('compileJava') {
    options.encoding = 'UTF-8'
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

task runClient(type: JavaExec) {
    dependsOn 'classes'
    main = 'net.minecraft.client.Minecraft'
    classpath = sourceSets.main.runtimeClasspath
    args = ['--username', 'test']
}

task runServer(type: JavaExec) {
    dependsOn 'classes'
    main = 'net.minecraft.server.MinecraftServer'
    classpath = sourceSets.main.runtimeClasspath
    args = ['--nogui']
}

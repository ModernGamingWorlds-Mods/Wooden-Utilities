plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'com.modrinth.minotaur' version '2.8.0'
}

group = 'com.example'
version = '1.0.0'
archivesBaseName = 'woodenutilities' // The name of your mod

minecraft {
    version = "1.20.1-47.3.12"
    runDir = "run"
    mappings = "official"
    modLoaders = ['forge']
}

repositories {
    maven {
        name = "Forge Maven"
        url = uri("https://maven.minecraftforge.net")
    }
    mavenCentral()
}

dependencies {
    // The Forge dependency itself
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.12'
}

tasks.named('compileJava') {
    options.encoding = 'UTF-8'
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

task runClient(type: JavaExec) {
    dependsOn 'classes'
    main = 'net.minecraft.client.Minecraft'
    classpath = sourceSets.main.runtimeClasspath
    args = ['--username', 'test']
}

task runServer(type: JavaExec) {
    dependsOn 'classes'
    main = 'net.minecraft.server.MinecraftServer'
    classpath = sourceSets.main.runtimeClasspath
    args = ['--nogui']
}

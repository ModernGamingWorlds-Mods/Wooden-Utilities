// ── Plugin declarations ───────────────────────────────────────────────────────
plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    // Declared with apply=false so both land in the classpath; we apply one below.
    id 'net.minecraftforge.gradle' version '[6.0,6.2)' apply false
    id 'net.neoforged.gradle.userdev' version '7.0.184' apply false
    // ModDevGradle: used for NeoForge 26.x+ (new versioning scheme)
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

// ── Stonecutter: determine current build target ───────────────────────────────
// project.name is the version string (e.g. "1.20.1-forge" or "1.21.1-neoforge")
// when building a versioned subproject, or "Wooden-Utilities" for the root task.
boolean isForge    = project.name.endsWith('-forge')
boolean isNeoForge = project.name.endsWith('-neoforge')

// MC version parsing must happen before plugin application so we can pick NFG vs MDG
def mcVer = minecraft_version.tokenize('.')
int mcMajor = mcVer[0].toInteger()
int mcMinor = mcVer[1].toInteger()
int mcPatch = mcVer.size() > 2 ? mcVer[2].toInteger() : 0

// NeoForge 26.x+ uses ModDevGradle; older NeoForge uses NeoForged Gradle (NFG)
if (isNeoForge && mcMajor >= 26) apply plugin: 'net.neoforged.moddev'
else if (isNeoForge)             apply plugin: 'net.neoforged.gradle.userdev'
if (isForge)                     apply plugin: 'net.minecraftforge.gradle'

// ── Stonecutter preprocessor constants ───────────────────────────────────────
stonecutter.const 'forge',    isForge
stonecutter.const 'neoforge', isNeoForge

// forge_1201: only 1.20.1-forge (has getId(), NetworkHooks, old serializer signatures)
stonecutter.const 'forge_1201', (isForge && mcMinor == 20 && mcPatch == 1)

// forge_mid: 1.20.2-forge and 1.20.4-forge (codec() returns Codec<T>, uses FriendlyByteBuf)
stonecutter.const 'forge_mid', (isForge && mcMinor == 20 && (mcPatch == 2 || mcPatch == 4))

// old_props: 1.20.1 and 1.20.2 forge use BlockBehaviour.Properties.copy(); 1.20.4+ use ofFullCopy()
stonecutter.const 'old_props', (isForge && mcMinor == 20 && mcPatch <= 2)

// recipe_holder: getAllRecipesFor returns List<RecipeHolder<T>> (all except 1.20.1-forge)
stonecutter.const 'recipe_holder', (isNeoForge || (isForge && !(mcMinor == 20 && mcPatch == 1)))

// modern_nbt: saveAdditional/load/getUpdateTag/onDataPacket take HolderLookup.Provider
//             Also: RecipeInput, isSameItemSameComponents, codec-based recipe serializer
//             True for: 1.20.6-forge and all NeoForge
stonecutter.const 'modern_nbt', (isNeoForge || (isForge && (mcMinor > 20 || mcPatch >= 6)))

// has_item_props: ItemProperties and ClampedItemPropertyFunction exist
//                Removed in NeoForge 1.21.4+ and all 26.x+ versions
stonecutter.const 'has_item_props', !(isNeoForge && (mcMajor >= 26 || (mcMinor == 21 && mcPatch >= 4)))

// block_codec: BaseEntityBlock requires codec() override
//              True for all except forge_1201
stonecutter.const 'block_codec', !(isForge && mcMinor == 20 && mcPatch == 1)

// has_geckolib: GeckoLib dependency is present (geckolib_version property defined in gradle.properties)
stonecutter.const 'has_geckolib', project.hasProperty('geckolib_version')

// ── Project coordinates ───────────────────────────────────────────────────────
version = mod_version
group   = maven_group

base {
    archivesName = mod_id
}

// Minecraft 26.x (NeoForge) requires Java 25; Forge 1.20.6+ and all NeoForge <26 require Java 21; older Forge uses Java 17
def mcParts = minecraft_version.split('\\.')
boolean needsJava25 = isNeoForge && mcMajor >= 26
boolean forgeNeedsJava21 = isForge && (mcParts[1].toInteger() > 20 ||
        (mcParts[1].toInteger() == 20 && mcParts.length > 2 && mcParts[2].toInteger() >= 6))
java.toolchain.languageVersion = JavaLanguageVersion.of(needsJava25 ? 25 : (isNeoForge || forgeNeedsJava21) ? 21 : 17)

// ── Loader-specific configuration ────────────────────────────────────────────
if (isNeoForge) {
    sourceSets.main.resources { srcDir 'src/generated/resources' }

    repositories {
        maven { url = 'https://maven.blamejared.com' }
        maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    }

    if (mcMajor >= 26) {
        // ── NeoForge 26.x+ — ModDevGradle (net.neoforged.moddev) ─────────────
        neoForge {
            version = neo_version

            runs {
                configureEach {
                    systemProperty 'neoforge.logging.markers', 'REGISTRIES'
                    systemProperty 'neoforge.logging.console.level', 'debug'
                }
                client {
                    client()
                    systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
                }
                server {
                    server()
                    programArgument '--nogui'
                }
            }

            mods {
                "${mod_id}" {
                    sourceSet sourceSets.main
                }
            }
        }

        dependencies {
            if (project.hasProperty('geckolib_version')) {
                implementation "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
            }
            if (jei_version != 'none') {
                compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
                runtimeOnly  "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
            }
        }

    } else {
        // ── NeoForge <26 — NeoForged Gradle (net.neoforged.gradle.userdev) ───
        runs {
            configureEach {
                systemProperty 'neoforge.logging.markers', 'REGISTRIES'
                systemProperty 'neoforge.logging.console.level', 'debug'
                modSource project.sourceSets.main
            }
            client {
                systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            }
            server {
                systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
                programArgument '--nogui'
            }
        }

        dependencies {
            implementation "net.neoforged:neoforge:${neo_version}"
            if (project.hasProperty('geckolib_version')) {
                implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
            }
            if (jei_version != 'none') {
                compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
                runtimeOnly  "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
            }
        }
    }

} else if (isForge) {
    minecraft {
        mappings channel: mapping_channel, version: mapping_version
        copyIdeResources = true

        runs {
            configureEach {
                workingDirectory project.file('run')
                property 'forge.logging.markers', 'REGISTRIES'
                property 'forge.logging.console.level', 'debug'
                mods {
                    "${mod_id}" { source sourceSets.main }
                }
            }
            client  {}
            server  { args '--nogui' }
        }
    }

    repositories {
        maven { url = 'https://maven.blamejared.com' }
        maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    }

    dependencies {
        minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
        if (project.hasProperty('geckolib_version')) {
            implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
        }
        if (jei_version != 'none') {
            compileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
            runtimeOnly  "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
        }
    }
}

// ── processResources ─────────────────────────────────────────────────────────
tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        mod_issues       : mod_issues,
        mod_homepage     : mod_homepage,
        mod_id           : mod_id,
        mod_name         : mod_name,
        mod_license      : mod_license,
        mod_version      : mod_version,
        mod_author       : mod_author,
        mod_description  : mod_description,
        jei_version      : jei_version,
    ]

    inputs.properties replaceProperties

    if (isNeoForge) {
        replaceProperties.put('neo_version', neo_version)
        exclude 'META-INF/mods.toml'
        filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
            expand replaceProperties + [project: project]
        }
    } else if (isForge) {
        replaceProperties.put('forge_version', forge_version)
        exclude 'META-INF/neoforge.mods.toml'
        filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
            expand replaceProperties + [project: project]
        }
    }
}

// ── Jar manifest ─────────────────────────────────────────────────────────────
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_author,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : mod_author,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

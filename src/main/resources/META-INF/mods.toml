modLoader="javafml"
loaderVersion="[47,)"
license="${mod_license}"
issueTrackerURL="${mod_issues}"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    displayURL="${mod_homepage}"
    authors="${mod_author}"
    description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[${forge_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[${minecraft_version}]"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=false
    versionRange="[${jei_version},)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="geckolib"
    mandatory=true
    versionRange="[4,)"
    ordering="BEFORE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sophisticatedstorage"
    mandatory=false
    versionRange="[1.4,)"
    ordering="NONE"
    side="BOTH"
